version: 0.2

phases:
  install:
    commands:
      - echo Entered the install phase...
      - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | /bin/bash
      - export NVM_DIR="$HOME/.nvm"
      - '[ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"' 
      - '[ -s "$NVM_DIR/bash_completion" ] && source "$NVM_DIR/bash_completion"' # Cargar autocompletado de NVM

    finally:
      - echo This always runs even if the update or install command fails 
  pre_build:
    commands:
      - echo Entered the pre_build phase...
      - nvm --version
      - nvm install 20
      - nvm use 20

    finally:
      - echo This always runs even if the login command fails 
  build:
    commands:
      - echo Entered the build phase...
      - echo Build started on `date`
      - npm run build

    finally:
      - echo This always runs even if the install command fails
  post_build:
    commands:
      - echo Entered the post_build phase...
      - echo Build completed on `date`

artifacts:
  files:
    - '**/*'
  base-directory: dist # Cambia esto según tu estructura de directorios

cache:
  paths:
    - node_modules/**/* # Cache para acelerar futuras construcciones